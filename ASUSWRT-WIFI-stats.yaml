        name: wheeler
        version: 4c8b134
      groups:
        - name: 'Templates/Network devices'
      items:
        - uuid: 3f15d92444ad44bab6c87069ffc041f1
          name: 'get wifi station data'
          key: 'client.stats["-i",{$WIRELESS_INTERFACE_MAPPINGS},"-m",{$MAPPING_FILE}]'
          value_type: TEXT
        - uuid: cf5441e0aeb64aa69fac69f085e51368
          name: 'Interface eth6 radio airtime_self'
          type: DEPENDENT
          key: radio.eth6.airtime_self
          trends: '0'
          units: '%'
          description: 'Percentage of airtime used by this AP and its clients. Represents your network’s share of the channel.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.airtime_self
          master_item:
            key: 'radio.stats[eth6]'
          tags:
            - tag: interface
              value: eth6
            - tag: metric
              value: airtime_self
            - tag: radio
              value: 2G
        - uuid: b3b94cd264034e92a831f3e17420908b
          name: 'Interface eth6 radio bandwidth'
          type: DEPENDENT
          key: radio.eth6.bandwidth
          trends: '0'
          units: Mhz
          description: 'Channel width in MHz (e.g., 20/40/80). Wider channels provide higher throughput but are more susceptible to interference.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.bandwidth
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - '3600'
          master_item:
            key: 'radio.stats[eth6]'
          tags:
            - tag: interface
              value: eth6
            - tag: metric
              value: bandwidth
            - tag: radio
              value: 2G
        - uuid: 905809ad42af4f0790a2a84b399d99d5
          name: 'Interface eth6 radio bssid'
          type: DEPENDENT
          key: radio.eth6.bssid
          value_type: TEXT
          description: 'MAC address of the access point radio. Uniquely identifies the wireless interface.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.bssid
          master_item:
            key: 'radio.stats[eth6]'
          tags:
            - tag: interface
              value: eth6
            - tag: metric
              value: bssid
            - tag: radio
              value: 2G
        - uuid: 1bf6b43080bf479fb9cf2d3ab29a18c5
          name: 'Interface eth6 radio busy'
          type: DEPENDENT
          key: radio.eth6.busy
          value_type: FLOAT
          trends: '0'
          units: '%'
          description: |
            Calculated as 100 - chanim_idle. Represents the percentage of time the channel is in use (non-idle).
            
            Higher values indicate reduced available airtime and potential congestion. Use with retry_ratio and neighbors_share_of_busy_pct to determine cause (self, neighbors, or RF conditions).
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.chanim_idle
            - type: JAVASCRIPT
              parameters:
                - 'return 100 - value;'
          master_item:
            key: 'radio.stats[eth6]'
          tags:
            - tag: interface
              value: eth6
            - tag: metric
              value: busy
            - tag: radio
              value: 2G
        - uuid: c6d75c431b7642c1bfbc195eee4c8aad
          name: 'Interface eth6 radio bad plcp'
          type: DEPENDENT
          key: radio.eth6.chanim_badplcp
          trends: '0'
          description: 'Count or percentage of malformed PLCP headers detected. Indicates corrupted RF frames, often due to interference.'
          preprocessing:
