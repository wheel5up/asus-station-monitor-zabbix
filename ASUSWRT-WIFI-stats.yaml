zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 36bff6c29af64692839d077febfc7079
      name: 'Templates/Network devices'
  host_groups:
    - uuid: 900ab33e25af4f4b97c8e27054dab6b4
      name: wifi
  templates:
    - uuid: c2c2263041de4c72891c711827dd0c9e
      template: 'ASUSWRT WiFi stats'
      name: 'ASUSWRT WiFi stats'
